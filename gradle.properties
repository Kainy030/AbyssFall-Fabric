# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Local JDK 21 used as the Java toolchain (Minecraft 1.21.11's official runtime is
# java-runtime-delta = Java 21). Gradle itself runs on JDK 25.
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-21.0.10+7
org.gradle.java.installations.auto-download=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17.19

# Mod Properties
version=0.5-Dev
group=com.abyssfall
maven_group=com.abyssfall
archives_base_name=abyssfall

# Dependencies
fabric_api_version=0.141.6+1.21.11
