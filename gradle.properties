# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Local JDK 25 used as the Java toolchain (Minecraft 26.2's official runtime is
# java-runtime-epsilon = Java 25, verified against Mojang's version manifest).
# Gradle itself also runs on JDK 25 here, but the toolchain is pinned explicitly so the
# produced bytecode never depends on whichever JDK happens to launch Gradle.
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-25.0.2
org.gradle.java.installations.auto-download=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# Mod Properties
version=1.2-Dev
group=com.abyssfall
maven_group=com.abyssfall
archives_base_name=abyssfall

# Dependencies
fabric_api_version=0.158.0+26.2
